[tool.poetry]
name = "the-matrix-data-eng"
version = "1.0.0"
description = "Zion Data Engineering - Package and Environment Management"
authors = ["Vicente von Bonhorst vivilourenzo5@gmail.com"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
numpy = "^1.24.0"
matplotlib = "^3.7.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"